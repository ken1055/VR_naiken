<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR 内見ビューア</title>
    <meta name="description" content="本物の部屋の中を自由に歩き回れる 3D 内見ビューア。360度写真では伝わらない質感・奥行きをブラウザだけで体験できます。">

    <!-- OGP（LINE / SNS で URL 共有時のプレビュー用。画像は assets/ogp.png を差し替え可能） -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="3D内見ビューア">
    <meta property="og:title" content="3D内見ビューア | 本物の部屋を歩ける内見体験">
    <meta property="og:description" content="本物の部屋の中を自由に歩き回れる 3D 内見ビューア。ブラウザだけで、アプリ不要。">
    <meta property="og:url" content="https://ken1055.github.io/VR_naiken/">
    <meta property="og:image" content="https://ken1055.github.io/VR_naiken/assets/ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <!-- GA4 アクセス計測（下の GA4_ID を測定 ID に差し替えると有効化される。
         管理ツール admin.html には入れないこと — 管理作業で計測を汚さないため） -->
    <script>
        (function () {
            var GA4_ID = 'G-XXXXXXXXXX';  // ← GA4 の測定 ID（G-…）に差し替え

            // main.js から呼ばれるイベント送信ヘルパー。ID 未設定時は no-op。
            window._track = function () {};

            if (GA4_ID === 'G-XXXXXXXXXX' || !/^G-[A-Z0-9]+$/.test(GA4_ID)) return;

            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4_ID;
            document.head.appendChild(s);

            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', GA4_ID);

            window._track = function (name, params) { gtag('event', name, params || {}); };
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #application-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            touch-action: none;
        }

        /* UI レイヤー */
        #ui-root {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #ui-root > * {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <canvas id="application-canvas"></canvas>
    <div id="ui-root"></div>

    <!-- PlayCanvas エンジン（同梱・バージョン固定。更新時は vendor/ に新版を置いて参照を差し替える）-->
    <script src="vendor/playcanvas-2.7.4.min.js"></script>

    <!-- モジュール（依存順）
         ?v= はキャッシュバスタ。src/*.js を変更してデプロイしたら必ず日付を上げること。
         （バージョン無しだと、再訪ブラウザが「新HTML+旧JS」の混在キャッシュになり
           モジュール間APIの不一致で読み込みが止まる） -->
    <script src="src/collider.js?v=20260804b"></script>
    <script src="src/lcc-parser.js?v=20260804b"></script>
    <script src="src/gsplat-loader.js?v=20260804b"></script>
    <script src="src/gsplat-renderer.js?v=20260804b"></script>
    <script src="src/pano-renderer.js?v=20260804b"></script>
    <script src="src/camera-controller.js?v=20260804b"></script>
    <script src="src/vr-mode.js?v=20260804b"></script>
    <script src="src/ui.js?v=20260804b"></script>
    <script src="src/teleport.js?v=20260804b"></script>

    <!-- エントリーポイント（最後） -->
    <script src="src/main.js?v=20260804b"></script>

    <!-- 閲覧者は目線の高さを床に固定したウォークモード（管理ツール admin.html は自由移動のまま）-->
    <script>
        if (window.CameraController) CameraController.setWalkMode(true);
    </script>
</body>
</html>
