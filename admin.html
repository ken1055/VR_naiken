<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ツール | VR 内見ビューア</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #application-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            touch-action: none;
        }

        #ui-root {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #ui-root > * { pointer-events: auto; }

        /* ---- ロック画面 ---- */
        #admin-lock {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(4, 4, 12, 0.97);
            backdrop-filter: blur(20px);
        }

        #admin-lock-panel {
            width: min(360px, 90vw);
            background: rgba(12, 12, 28, 0.98);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 32px 28px;
            display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            font-family: system-ui, -apple-system, sans-serif;
        }

        #admin-lock-panel h2 {
            font-size: 17px; font-weight: 600; letter-spacing: -0.3px;
            color: rgba(248,250,252,0.9);
        }

        #admin-lock-label {
            font-size: 12px;
            color: rgba(248,250,252,0.4);
            margin-bottom: -6px;
        }

        #admin-password-input {
            padding: 11px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #f8fafc; font-size: 14px;
            outline: none;
            font-family: system-ui, sans-serif;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        #admin-password-input:focus {
            border-color: rgba(245,158,11,0.6);
            background: rgba(245,158,11,0.04);
            box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
        }

        #admin-password-input::placeholder { color: rgba(248,250,252,0.25); }

        #admin-login-btn {
            padding: 11px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none; border-radius: 10px;
            color: #fff; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.15s;
            font-family: system-ui, sans-serif;
            box-shadow: 0 4px 16px rgba(245,158,11,0.3);
        }

        #admin-login-btn:hover {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(245,158,11,0.45);
        }

        #admin-login-btn:active { transform: translateY(0); }

        #admin-login-error {
            font-size: 12px; color: rgba(248,113,113,0.9);
            min-height: 16px; text-align: center;
            transition: opacity 0.2s;
        }

        #admin-lock-hint {
            font-size: 11px; color: rgba(248,250,252,0.2);
            text-align: center; line-height: 1.6;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 14px;
        }

        /* ---- 管理者バッジ（ログイン後にヘッダーへ挿入） ---- */
        #admin-badge {
            font-size: 10px; padding: 2px 8px; border-radius: 4px;
            background: rgba(245,158,11,0.18);
            color: rgba(253,230,138,0.85);
            border: 1px solid rgba(245,158,11,0.35);
            font-family: system-ui, sans-serif;
            white-space: nowrap; user-select: none;
        }
    </style>
</head>
<body>
    <!-- パスワードロック画面（認証前は全体を覆う） -->
    <div id="admin-lock">
        <div id="admin-lock-panel">
            <h2>管理者ログイン</h2>
            <div id="admin-lock-label">パスワード</div>
            <input
                type="password"
                id="admin-password-input"
                placeholder="パスワードを入力"
                autocomplete="current-password"
            >
            <button id="admin-login-btn">ログイン</button>
            <div id="admin-login-error"></div>
            <div id="admin-lock-hint">
                このページは管理者専用です。<br>
                お客様には公開しないでください。
            </div>
        </div>
    </div>

    <canvas id="application-canvas"></canvas>
    <div id="ui-root"></div>

    <!-- PlayCanvas エンジン（認証前でもロード可） -->
    <script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>

    <script>
        // ================================================================
        // パスワード設定
        // ※ このファイルをお客様に公開しないでください
        // ================================================================
        var ADMIN_PASSWORD = 'Tn090410211055'; // ← 必ず変更してください

        // ================================================================
        // ロック画面の制御
        // ================================================================
        var _lockEl   = document.getElementById('admin-lock');
        var _loginBtn = document.getElementById('admin-login-btn');
        var _pwInput  = document.getElementById('admin-password-input');
        var _errorEl  = document.getElementById('admin-login-error');

        _loginBtn.addEventListener('click', function () {
            if (_pwInput.value === ADMIN_PASSWORD) {
                _lockEl.style.display = 'none';
                _pwInput.blur(); // フォーカスを外してゲームキーが効くようにする
                _loadApp();
            } else {
                _errorEl.textContent = 'パスワードが違います';
                _pwInput.value = '';
                _pwInput.focus();
            }
        });

        _pwInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // Enter のブラウザデフォルトを抑制
                _loginBtn.click();
            }
            if (_errorEl.textContent) _errorEl.textContent = '';
        });

        // ページ表示時に入力欄へフォーカス
        window.addEventListener('load', function () { _pwInput.focus(); });

        // ================================================================
        // アプリ本体の動的ロード（認証後のみ実行）
        // ================================================================
        function _loadApp() {
            var scripts = [
                'src/collider.js',
                'src/lcc-parser.js',
                'src/gsplat-loader.js',
                'src/gsplat-renderer.js',
                'src/camera-controller.js',
                'src/vr-mode.js',
                'src/ui.js',
                'src/main.js',
            ];

            (function loadNext(i) {
                if (i >= scripts.length) {
                    _addAdminUI();
                    return;
                }
                var s = document.createElement('script');
                s.src = scripts[i];
                s.onload  = function () { loadNext(i + 1); };
                s.onerror = function () {
                    console.error('[Admin] スクリプト読み込み失敗:', scripts[i]);
                };
                document.head.appendChild(s);
            }(0));
        }

        // ================================================================
        // 管理者専用 UI の注入
        // ================================================================
        function _addAdminUI() {
            var header = document.getElementById('vr-header');
            if (!header) {
                // ui.js の初期化完了を待つ
                setTimeout(_addAdminUI, 50);
                return;
            }

            // 管理者バッジ
            var badge = document.createElement('span');
            badge.id = 'admin-badge';
            badge.textContent = '管理者モード';

            // 「位置をコピー」ボタン
            var copyBtn = document.createElement('button');
            copyBtn.id = 'admin-copy-pos-btn';
            copyBtn.className = 'vr-btn';
            copyBtn.textContent = '位置をコピー';
            copyBtn.style.cssText = [
                'background:rgba(245,158,11,0.12);',
                'border-color:rgba(245,158,11,0.35);',
                'color:rgba(253,230,138,0.9);',
            ].join('');

            copyBtn.addEventListener('click', function () {
                var state  = window.CameraController.getState();
                var json   = JSON.stringify({ initialCamera: state }, null, 2);

                navigator.clipboard.writeText(json).then(function () {
                    copyBtn.textContent = 'コピー完了!';
                    setTimeout(function () { copyBtn.textContent = '位置をコピー'; }, 2000);
                }).catch(function () {
                    // クリップボード API が使えない環境向けフォールバック
                    prompt('以下の JSON をコピーしてファイルに保存してください:', json);
                });
            });

            // 「位置を保存」ボタン（JSON ファイルへ上書き保存）
            var saveBtn = document.createElement('button');
            saveBtn.id = 'admin-save-pos-btn';
            saveBtn.className = 'vr-btn';
            saveBtn.textContent = '位置を保存';
            saveBtn.style.cssText = [
                'background:rgba(34,197,94,0.12);',
                'border-color:rgba(34,197,94,0.35);',
                'color:rgba(134,239,172,0.9);',
            ].join('');

            saveBtn.addEventListener('click', function () {
                var state = window.CameraController.getState();
                var json  = JSON.stringify({ initialCamera: state }, null, 2);
                var suggestedName = window._adminCurrentJSONName || 'scene.json';

                if (window.showSaveFilePicker) {
                    window.showSaveFilePicker({
                        suggestedName: suggestedName,
                        types: [{ description: 'JSON ファイル', accept: { 'application/json': ['.json'] } }]
                    }).then(function (handle) {
                        return handle.createWritable().then(function (writable) {
                            return writable.write(json).then(function () {
                                return writable.close();
                            });
                        });
                    }).then(function () {
                        saveBtn.textContent = '保存完了!';
                        setTimeout(function () { saveBtn.textContent = '位置を保存'; }, 2000);
                    }).catch(function (e) {
                        if (e.name !== 'AbortError') {
                            alert('保存に失敗しました: ' + e.message);
                        }
                    });
                } else {
                    // File System Access API 非対応のフォールバック: ダウンロード
                    var blob = new Blob([json], { type: 'application/json' });
                    var url  = URL.createObjectURL(blob);
                    var a    = document.createElement('a');
                    a.href = url; a.download = suggestedName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    saveBtn.textContent = 'ダウンロード完了!';
                    setTimeout(function () { saveBtn.textContent = '位置を保存'; }, 2000);
                }
            });

            // ---- コリジョン生成パネル ----
            var colliderPanel = document.createElement('div');
            colliderPanel.id = 'admin-collider-panel';
            colliderPanel.style.cssText = [
                'display:none; position:fixed; top:56px; right:16px; z-index:500;',
                'width:min(340px,94vw);',
                'background:rgba(10,8,24,0.98);',
                'border:1px solid rgba(245,158,11,0.25);',
                'border-radius:18px; padding:22px 20px;',
                'font-family:system-ui,-apple-system,sans-serif; color:#f8fafc;',
                'box-shadow:0 24px 72px rgba(0,0,0,0.8);',
                'backdrop-filter:blur(24px);',
            ].join('');

            var A = {  // amber スタイル定数
                btn: [
                    'display:block; width:100%; padding:11px 16px; border-radius:10px;',
                    'background:rgba(245,158,11,0.12); border:1.5px solid rgba(245,158,11,0.35);',
                    'color:rgba(253,230,138,0.9); font-size:13px; font-weight:600;',
                    'cursor:pointer; transition:all 0.15s; font-family:system-ui,sans-serif;',
                    'text-align:center;',
                ].join(''),
                btnPrimary: [
                    'display:block; width:100%; padding:12px; border-radius:10px;',
                    'background:linear-gradient(135deg,#f59e0b,#d97706); border:none;',
                    'color:#fff; font-size:13.5px; font-weight:700;',
                    'cursor:pointer; transition:all 0.15s; font-family:system-ui,sans-serif;',
                ].join(''),
                btnGreen: [
                    'display:none; width:100%; padding:11px; border-radius:10px; margin-top:10px;',
                    'background:linear-gradient(135deg,#22c55e,#16a34a); border:none;',
                    'color:#fff; font-size:13px; font-weight:700;',
                    'cursor:pointer; transition:all 0.15s; font-family:system-ui,sans-serif;',
                ].join(''),
                label: 'font-size:11px; color:rgba(248,250,252,0.35); margin-bottom:6px; display:block;',
                hint:  'font-size:11px; color:rgba(248,250,252,0.28); line-height:1.65; margin-top:4px;',
            };

            // パネルヘッダー
            var panelHeader = document.createElement('div');
            panelHeader.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;';
            var panelTitle = document.createElement('div');
            panelTitle.textContent = 'コリジョン生成';
            panelTitle.style.cssText = 'font-size:15px; font-weight:700; letter-spacing:-0.3px;';
            var panelClose = document.createElement('button');
            panelClose.textContent = '×';
            panelClose.style.cssText = [
                'width:26px; height:26px; border-radius:50%;',
                'background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);',
                'color:rgba(248,250,252,0.5); font-size:15px; cursor:pointer;',
                'display:flex; align-items:center; justify-content:center;',
            ].join('');
            panelClose.addEventListener('click', function () { colliderPanel.style.display = 'none'; });
            panelHeader.appendChild(panelTitle);
            panelHeader.appendChild(panelClose);
            colliderPanel.appendChild(panelHeader);

            // 説明文
            var panelHint = document.createElement('div');
            panelHint.style.cssText = 'font-size:12px; color:rgba(248,250,252,0.35); line-height:1.7; margin-bottom:16px;';
            panelHint.textContent = 'PLY/Splat ファイルからコリジョンデータを生成します。生成した .hmap.json を PLY と同じ場所に配置すると自動で読み込まれます。';
            colliderPanel.appendChild(panelHint);

            // ファイル選択
            var colliderFileInput = document.createElement('input');
            colliderFileInput.type = 'file';
            colliderFileInput.accept = '.ply,.splat';
            colliderFileInput.style.display = 'none';
            colliderPanel.appendChild(colliderFileInput);

            var fileLabel = document.createElement('span');
            fileLabel.style.cssText = A.label;
            fileLabel.textContent = 'PLY / Splat ファイル';
            colliderPanel.appendChild(fileLabel);

            var fileRow = document.createElement('div');
            fileRow.style.cssText = 'display:flex; gap:8px; margin-bottom:14px;';

            var fileSelectBtn = document.createElement('button');
            fileSelectBtn.textContent = '選択...';
            fileSelectBtn.style.cssText = [
                'padding:9px 14px; border-radius:8px;',
                'background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);',
                'color:rgba(248,250,252,0.7); font-size:12px; cursor:pointer;',
                'white-space:nowrap; font-family:system-ui,sans-serif;',
            ].join('');
            fileSelectBtn.addEventListener('click', function () { colliderFileInput.click(); });

            var fileNameEl = document.createElement('div');
            fileNameEl.textContent = '未選択';
            fileNameEl.style.cssText = [
                'flex:1; padding:9px 12px; border-radius:8px; font-size:12px;',
                'background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);',
                'color:rgba(248,250,252,0.35); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;',
            ].join('');

            fileRow.appendChild(fileSelectBtn);
            fileRow.appendChild(fileNameEl);
            colliderPanel.appendChild(fileRow);

            // 進捗表示
            var progressWrap = document.createElement('div');
            progressWrap.style.cssText = 'display:none; margin-bottom:14px;';
            var progressBar = document.createElement('div');
            progressBar.style.cssText = [
                'height:6px; border-radius:3px; background:rgba(245,158,11,0.15);',
                'margin-bottom:8px; overflow:hidden;',
            ].join('');
            var progressInner = document.createElement('div');
            progressInner.style.cssText = [
                'height:100%; border-radius:3px; width:0%;',
                'background:linear-gradient(90deg,#f59e0b,#d97706);',
                'transition:width 0.2s;',
            ].join('');
            progressBar.appendChild(progressInner);
            var progressMsg = document.createElement('div');
            progressMsg.style.cssText = 'font-size:12px; color:rgba(248,250,252,0.45);';
            progressWrap.appendChild(progressBar);
            progressWrap.appendChild(progressMsg);
            colliderPanel.appendChild(progressWrap);

            // 生成ボタン
            var genBtn = document.createElement('button');
            genBtn.textContent = '生成開始';
            genBtn.disabled = true;
            genBtn.style.cssText = A.btnPrimary;
            genBtn.style.opacity = '0.4';
            colliderPanel.appendChild(genBtn);

            // ダウンロードボタン
            var downloadBtn = document.createElement('button');
            downloadBtn.textContent = '.hmap.json をダウンロード';
            downloadBtn.style.cssText = A.btnGreen;
            colliderPanel.appendChild(downloadBtn);

            document.body.appendChild(colliderPanel);

            // ---- ファイル選択時 ----
            var _selectedFile = null;
            colliderFileInput.addEventListener('change', function () {
                _selectedFile = colliderFileInput.files[0] || null;
                fileNameEl.textContent = _selectedFile ? _selectedFile.name : '未選択';
                fileNameEl.style.color = _selectedFile ? 'rgba(248,250,252,0.75)' : 'rgba(248,250,252,0.35)';
                genBtn.disabled = !_selectedFile;
                genBtn.style.opacity = _selectedFile ? '1' : '0.4';
                downloadBtn.style.display = 'none';
                progressWrap.style.display = 'none';
                progressInner.style.width = '0%';
                colliderFileInput.value = '';
            });

            // ---- 生成開始 ----
            genBtn.addEventListener('click', function () {
                if (!_selectedFile || !window.Collider) return;
                genBtn.disabled = true;
                genBtn.textContent = '処理中...';
                downloadBtn.style.display = 'none';
                progressWrap.style.display = 'block';
                progressInner.style.width = '0%';
                progressMsg.textContent = '読み込み中...';

                var reader = new FileReader();
                reader.readAsArrayBuffer(_selectedFile);
                reader.onload = function () {
                    Collider.reset();
                    Collider.buildAsync(
                        reader.result,
                        _selectedFile.name,
                        function onProgress(pct, msg) {
                            progressInner.style.width = pct + '%';
                            progressMsg.textContent   = msg || (pct + '%');
                        },
                        function onDone(err) {
                            genBtn.disabled = false;
                            genBtn.textContent = '生成開始';
                            if (err) {
                                progressMsg.textContent = 'エラー: ' + (err.message || err);
                                return;
                            }
                            progressMsg.textContent = '完了 — ダウンロードしてください';
                            var data   = Collider.exportJSON();
                            var json   = JSON.stringify(data);
                            var blob   = new Blob([json], { type: 'application/json' });
                            var objUrl = URL.createObjectURL(blob);
                            var suggested = _selectedFile.name.replace(/\.(ply|splat)$/i, '.hmap.json');

                            downloadBtn.style.display = 'block';
                            downloadBtn.onclick = function () {
                                if (window.showSaveFilePicker) {
                                    window.showSaveFilePicker({
                                        suggestedName: suggested,
                                        types: [{ description: 'Hmap JSON', accept: { 'application/json': ['.json'] } }]
                                    }).then(function (handle) {
                                        return handle.createWritable().then(function (w) {
                                            return w.write(json).then(function () { return w.close(); });
                                        });
                                    }).catch(function (e) {
                                        if (e.name !== 'AbortError') _fallbackDownload(objUrl, suggested);
                                    });
                                } else {
                                    _fallbackDownload(objUrl, suggested);
                                }
                            };
                        }
                    );
                };
            });

            function _fallbackDownload(url, name) {
                var a = document.createElement('a');
                a.href = url; a.download = name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            // ---- 管理者ボタン ----
            var colliderGenBtn = document.createElement('button');
            colliderGenBtn.className = 'vr-btn';
            colliderGenBtn.textContent = 'コリジョン生成';
            colliderGenBtn.style.cssText = [
                'background:rgba(245,158,11,0.12);',
                'border-color:rgba(245,158,11,0.35);',
                'color:rgba(253,230,138,0.9);',
            ].join('');
            colliderGenBtn.addEventListener('click', function () {
                var isOpen = colliderPanel.style.display !== 'none';
                colliderPanel.style.display = isOpen ? 'none' : 'block';
            });

            // 全画面ボタンの直前に挿入
            var fsBtn = document.getElementById('vr-fullscreen-btn');
            if (fsBtn) {
                header.insertBefore(colliderGenBtn, fsBtn);
                header.insertBefore(saveBtn, fsBtn);
                header.insertBefore(copyBtn, fsBtn);
                header.insertBefore(badge,   fsBtn);
            } else {
                header.appendChild(badge);
                header.appendChild(copyBtn);
                header.appendChild(saveBtn);
                header.appendChild(colliderGenBtn);
            }
        }
    </script>
</body>
</html>
